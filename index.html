<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enlace Business Pro - Sistema Local</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0b0f19; color: #f3f4f6; font-family: sans-serif; }
    </style>
</head>
<body class="min-h-screen flex flex-col p-6">

    <header class="bg-gray-900 border border-gray-800 rounded-xl p-4 mb-6 flex justify-between items-center shadow-xl">
        <div>
            <h1 class="text-xl font-bold text-white">ENLACE <span class="text-cyan-400">BUSINESS PRO</span></h1>
            <p class="text-xs text-gray-400">Sistema Integral de Recuperación Inmobiliaria</p>
        </div>
        <div class="flex items-center gap-3">
            <input type="text" id="searchInput" placeholder="BUSCAR..." class="px-3 py-2 bg-gray-950 border border-gray-800 rounded-lg text-sm text-white focus:outline-none focus:border-cyan-500 uppercase">
            <button onclick="abrirModalNuevo()" class="px-4 py-2 bg-cyan-500 hover:bg-cyan-400 text-black font-bold rounded-lg text-xs transition-all shadow-lg">
                + Nuevo Registro
            </button>
        </div>
    </header>

    <div class="grid grid-cols-1 sm:grid-cols-4 gap-4 mb-6">
        <div class="bg-gray-900 border border-gray-800 rounded-xl p-4">
            <p class="text-xs text-gray-400 uppercase">Total Registros</p>
            <h3 id="kpiTotal" class="text-3xl font-bold text-white mt-1">0</h3>
        </div>
        <div class="bg-gray-900 border border-gray-800 rounded-xl p-4">
            <p class="text-xs text-gray-400 uppercase">Utilidad Total</p>
            <h3 id="kpiUtilidad" class="text-2xl font-bold text-emerald-400 mt-1">$0.00</h3>
        </div>
        <div class="bg-gray-900 border border-gray-800 rounded-xl p-4">
            <p class="text-xs text-gray-400 uppercase">Precio Promedio</p>
            <h3 id="kpiPromedio" class="text-2xl font-bold text-amber-400 mt-1">$0.00</h3>
        </div>
        <div class="bg-gray-900 border border-gray-800 rounded-xl p-4">
            <p class="text-xs text-gray-400 uppercase">Cartera Principal</p>
            <h3 id="kpiCartera" class="text-lg font-bold text-cyan-300 mt-1">N/A</h3>
        </div>
    </div>

    <div class="bg-gray-900 border border-gray-800 rounded-xl overflow-hidden flex-1 shadow-2xl">
        <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-gray-950 border-b border-gray-800 text-[11px] text-gray-400 uppercase">
                        <th class="py-3 px-4">ID / Enlace</th>
                        <th class="py-3 px-4">Cartera</th>
                        <th class="py-3 px-4">Ubicación</th>
                        <th class="py-3 px-4">Precio Venta</th>
                        <th class="py-3 px-4">Utilidad Real</th>
                        <th class="py-3 px-4">Etapa</th>
                        <th class="py-3 px-4">Responsable</th>
                        <th class="py-3 px-4 text-center">Acciones</th>
                    </tr>
                </thead>
                <tbody id="tablaRegistros" class="divide-y divide-gray-800 text-xs"></tbody>
            </table>
        </div>
    </div>

    <div id="modalRegistro" class="fixed inset-0 bg-black/80 hidden flex items-center justify-center p-4">
        <div class="bg-gray-900 border border-gray-800 rounded-2xl max-w-xl w-full p-6 space-y-4">
            <h3 id="modalTitulo" class="text-base font-bold text-white">Nuevo Registro Inmobiliario</h3>
            <form id="formRegistro" class="grid grid-cols-2 gap-4" onsubmit="event.preventDefault();">
                <input type="hidden" id="regIndex">
                <div>
                    <label class="block text-xs text-gray-400 mb-1">ID / Enlace</label>
                    <input type="text" id="regIdEnlace" required class="w-full bg-gray-950 border border-gray-800 rounded p-2 text-white text-xs uppercase">
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Cartera</label>
                    <input type="text" id="regCartera" class="w-full bg-gray-950 border border-gray-800 rounded p-2 text-white text-xs uppercase">
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Estado</label>
                    <input type="text" id="regEstado" class="w-full bg-gray-950 border border-gray-800 rounded p-2 text-white text-xs uppercase">
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Municipio</label>
                    <input type="text" id="regMunicipio" class="w-full bg-gray-950 border border-gray-800 rounded p-2 text-white text-xs uppercase">
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Colonia</label>
                    <input type="text" id="regColonia" class="w-full bg-gray-950 border border-gray-800 rounded p-2 text-white text-xs uppercase">
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Responsable</label>
                    <input type="text" id="regResponsable" class="w-full bg-gray-950 border border-gray-800 rounded p-2 text-white text-xs uppercase">
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Precio Venta</label>
                    <input type="text" id="regPrecioVenta" class="w-full bg-gray-950 border border-gray-800 rounded p-2 text-white text-xs">
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Costo Adquisición</label>
                    <input type="text" id="regCostoAdquisicion" class="w-full bg-gray-950 border border-gray-800 rounded p-2 text-white text-xs">
                </div>
            </form>
            <div class="flex justify-end gap-2 pt-4 border-t border-gray-800">
                <button onclick="cerrarModal()" class="px-4 py-2 bg-gray-800 text-gray-300 rounded text-xs">Cancelar</button>
                <button onclick="guardarRegistro()" class="px-4 py-2 bg-cyan-500 text-black font-bold rounded text-xs">Guardar</button>
            </div>
        </div>
    </div>

    <script>
        let registros = [
            { idEnlace: "EN3012", cartera: "RECUPERACIÓN BANCARIA", estado: "ESTADO DE MÉXICO", municipio: "TLALNEPANTLA", colonia: "LOS REYES I", precioVenta: "$450,421.00", costoAdquisicion: "$100,000.00", etapaActual: "OBTENCIÓN DE AVALÚOS", responsable: "FRANCISCO BELMONT" },
            { idEnlace: "EN63211", cartera: "HIPOTECARIO", estado: "CDMX", municipio: "BENITO JUÁREZ", colonia: "DEL VALLE", precioVenta: "$890,000.00", costoAdquisicion: "$300,000.00", etapaActual: "ADJUDICACIÓN", responsable: "EQUIPO ENLACE" }
        ];

        function iniciar() {
            const guardado = localStorage.getItem('enlace_db_v3');
            if (guardado) {
                try { registros = JSON.parse(guardado); } catch(e){}
            }
            render();
        }

        function guardarLocal() {
            localStorage.setItem('enlace_db_v3', JSON.stringify(registros));
        }

        function parsearMoneda(str) {
            if (!str) return 0;
            if (typeof str === 'number') return str;
            return parseFloat(str.toString().replace(/[^0-9.]/g, '')) || 0;
        }

        function render() {
            const tbody = document.getElementById('tablaRegistros');
            const q = document.getElementById('searchInput').value.toUpperCase();
            
            let filtrados = registros.filter(r => {
                let txt = `${r.idEnlace} ${r.cartera} ${r.estado} ${r.municipio} ${r.colonia} ${r.responsable}`.toUpperCase();
                return !q || txt.includes(q);
            });

            let html = '';
            let totalV = 0, totalU = 0, carteras = {};

            filtrados.forEach((r, idx) => {
                let vNum = parsearMoneda(r.precioVenta);
                let cNum = parsearMoneda(r.costoAdquisicion);
                let util = vNum - cNum;

                totalV += vNum;
                totalU += util;
                if(r.cartera) carteras[r.cartera] = (carteras[r.cartera] || 0) + 1;

                html += `
                    <tr class="hover:bg-gray-800/40 cursor-pointer" onclick="editar(${registros.indexOf(r)})">
                        <td class="py-3 px-4 font-bold text-white">${r.idEnlace || ''}</td>
                        <td class="py-3 px-4 text-gray-300">${r.cartera || ''}</td>
                        <td class="py-3 px-4 text-gray-300">${r.colonia || ''}, ${r.municipio || ''} (${r.estado || ''})</td>
                        <td class="py-3 px-4 text-amber-400 font-semibold">${r.precioVenta || '$0.00'}</td>
                        <td class="py-3 px-4 text-emerald-400 font-semibold">$${util.toLocaleString('es-MX', {minimumFractionDigits:2})}</td>
                        <td class="py-3 px-4 text-gray-300">${r.etapaActual || ''}</td>
                        <td class="py-3 px-4 text-gray-300">${r.responsable || ''}</td>
                        <td class="py-3 px-4 text-center" onclick="event.stopPropagation();">
                            <button onclick="eliminar(${registros.indexOf(r)})" class="text-red-400 hover:text-red-300 text-xs bg-red-950/40 px-2 py-1 rounded border border-red-900/50">Eliminar</button>
                        </td>
                    </tr>
                `;
            });

            tbody.innerHTML = html || `<tr><td colspan="8" class="text-center py-6 text-gray-500">Sin registros.</td></tr>`;
            
            document.getElementById('kpiTotal').innerText = filtrados.length;
            document.getElementById('kpiUtilidad').innerText = '$' + totalU.toLocaleString('es-MX', {minimumFractionDigits:2});
            document.getElementById('kpiPromedio').innerText = filtrados.length ? '$' + (totalV / filtrados.length).toLocaleString('es-MX', {minimumFractionDigits:2}) : '$0.00';
            
            let carTop = "N/A", max = 0;
            for(let k in carteras) { if(carteras[k] > max) { max = carteras[k]; carTop = k; } }
            document.getElementById('kpiCartera').innerText = carTop;
        }

        function abrirModalNuevo() {
            document.getElementById('modalTitulo').innerText = "Nuevo Registro Inmobiliario";
            document.getElementById('formRegistro').reset();
            document.getElementById('regIndex').value = '';
            document.getElementById('modalRegistro').classList.remove('hidden');
        }

        function cerrarModal() {
            document.getElementById('modalRegistro').classList.add('hidden');
        }

        function editar(idx) {
            let r = registros[idx];
            document.getElementById('modalTitulo').innerText = "Editar Registro";
            document.getElementById('regIndex').value = idx;
            document.getElementById('regIdEnlace').value = r.idEnlace || '';
            document.getElementById('regCartera').value = r.cartera || '';
            document.getElementById('regEstado').value = r.estado || '';
            document.getElementById('regMunicipio').value = r.municipio || '';
            document.getElementById('regColonia').value = r.colonia || '';
            document.getElementById('regResponsable').value = r.responsable || '';
            document.getElementById('regPrecioVenta').value = r.precioVenta || '';
            document.getElementById('regCostoAdquisicion').value = r.costoAdquisicion || '';
            document.getElementById('modalRegistro').classList.remove('hidden');
        }

        function guardarRegistro() {
            let idx = document.getElementById('regIndex').value;
            let obj = {
                idEnlace: document.getElementById('regIdEnlace').value.toUpperCase(),
                cartera: document.getElementById('regCartera').value.toUpperCase(),
                estado: document.getElementById('regEstado').value.toUpperCase(),
                municipio: document.getElementById('regMunicipio').value.toUpperCase(),
                colonia: document.getElementById('regColonia').value.toUpperCase(),
                responsable: document.getElementById('regResponsable').value.toUpperCase(),
                precioVenta: document.getElementById('regPrecioVenta').value,
                costoAdquisicion: document.getElementById('regCostoAdquisicion').value,
                etapaActual: "EN PROCESO"
            };

            if(idx === "" || idx === null) {
                registros.push(obj);
            } else {
                registros[idx] = obj;
            }

            guardarLocal();
            render();
            cerrarModal();
        }

        function eliminar(idx) {
            if(confirm("¿Eliminar este registro?")) {
                registros.splice(idx, 1);
                guardarLocal();
                render();
            }
        }

        document.getElementById('searchInput').addEventListener('input', render);
        window.onload = iniciar;
    </script>
</body>
</html>
