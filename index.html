<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enlace Business - CRM & Base de Datos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #07090e; color: #f3f4f6; }
        .glass-panel { background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(12px); border: 1px solid rgba(0, 240, 255, 0.15); }
        .neon-border { border-color: rgba(0, 240, 255, 0.4); box-shadow: 0 0 15px rgba(0, 240, 255, 0.1); }
        .neon-glow:hover { box-shadow: 0 0 20px rgba(0, 240, 255, 0.3); }
        
        /* Fuerza la visualización en mayúsculas en los inputs y selects */
        input[type="text"], select, textarea { text-transform: uppercase; }

        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #07090e; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #00f0ff; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Top Header -->
    <header class="glass-panel border-b border-slate-800 sticky top-0 z-40 px-6 py-4 flex flex-wrap items-center justify-between gap-4">
        <div class="flex items-center space-x-4">
            <div class="bg-gradient-to-r from-cyan-500 to-blue-600 p-2.5 rounded-xl shadow-lg shadow-cyan-500/20">
                <i data-lucide="shield-check" class="w-7 h-7 text-slate-950"></i>
            </div>
            <div>
                <h1 class="text-xl font-bold tracking-wider text-white flex items-center gap-2">
                    ENLACE <span class="text-cyan-400 font-light">BUSINESS PRO</span>
                </h1>
                <p class="text-xs text-slate-400">Sistema Integral de Recuperación Inmobiliaria & Legal</p>
            </div>
        </div>

        <!-- Global Actions / Search -->
        <div class="flex items-center space-x-3 flex-wrap">
            <div class="relative">
                <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3 top-3"></i>
                <input type="text" id="globalSearch" placeholder="BUSCAR..." spellcheck="true" lang="es"
                    class="bg-slate-900/80 border border-slate-700 rounded-lg pl-9 pr-4 py-2 text-sm text-white focus:outline-none focus:border-cyan-400 w-64 md:w-80 transition-all">
            </div>
            <button onclick="verificarDuplicados()" class="bg-slate-800 hover:bg-slate-700 text-cyan-300 border border-cyan-500/30 px-3.5 py-2 rounded-lg text-sm font-medium flex items-center gap-2 transition-all">
                <i data-lucide="copy" class="w-4 h-4"></i> Verificar Duplicados
            </button>
            <button onclick="abrirModalNuevo()" class="bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-semibold px-4 py-2 rounded-lg text-sm flex items-center gap-2 shadow-lg shadow-cyan-500/20 transition-all">
                <i data-lucide="plus-circle" class="w-4 h-4"></i> Nuevo Registro
            </button>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="flex-1 p-6 max-w-[1600px] w-full mx-auto space-y-6">

        <!-- KPI Metrics Bar -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
            <div class="glass-panel p-4 rounded-xl border-l-4 border-l-cyan-400">
                <p class="text-xs font-medium text-slate-400 uppercase tracking-wider">Total Registros</p>
                <div class="flex items-baseline justify-between mt-1">
                    <h3 id="kpiTotal" class="text-2xl font-bold text-white">0</h3>
                    <span class="text-xs text-cyan-400 bg-cyan-950/50 px-2 py-0.5 rounded border border-cyan-800/50">Base Activa</span>
                </div>
            </div>
            <div class="glass-panel p-4 rounded-xl border-l-4 border-l-emerald-400">
                <p class="text-xs font-medium text-slate-400 uppercase tracking-wider">Utilidad Potencial Total</p>
                <div class="flex items-baseline justify-between mt-1">
                    <h3 id="kpiUtilidad" class="text-2xl font-bold text-emerald-400">$0.00</h3>
                    <span class="text-xs text-emerald-400 bg-emerald-950/50 px-2 py-0.5 rounded border border-emerald-800/50">Proyectado</span>
                </div>
            </div>
            <div class="glass-panel p-4 rounded-xl border-l-4 border-l-amber-400">
                <p class="text-xs font-medium text-slate-400 uppercase tracking-wider">Precio Venta Promedio</p>
                <div class="flex items-baseline justify-between mt-1">
                    <h3 id="kpiPromedioVenta" class="text-2xl font-bold text-amber-400">$0.00</h3>
                    <span class="text-xs text-amber-400 bg-amber-950/50 px-2 py-0.5 rounded border border-amber-800/50">Mercado</span>
                </div>
            </div>
            <div class="glass-panel p-4 rounded-xl border-l-4 border-l-blue-400">
                <p class="text-xs font-medium text-slate-400 uppercase tracking-wider">Cartera Principal</p>
                <div class="flex items-baseline justify-between mt-1">
                    <h3 id="kpiCartera" class="text-lg font-bold text-blue-300 truncate">ADMON FOME SHF117</h3>
                    <span class="text-xs text-blue-400 bg-blue-950/50 px-2 py-0.5 rounded border border-blue-800/50">Principal</span>
                </div>
            </div>
        </div>

        <!-- Filters and View Controls -->
        <div class="glass-panel p-4 rounded-xl flex flex-wrap items-center justify-between gap-4">
            <div class="flex items-center space-x-3 flex-wrap gap-y-2">
                <span class="text-xs text-slate-400 font-semibold uppercase tracking-wider flex items-center gap-1.5">
                    <i data-lucide="filter" class="w-3.5 h-3.5 text-cyan-400"></i> Filtrar por:
                </span>
                <select id="filterEstado" onchange="filtrarDatos()" class="bg-slate-900 border border-slate-700 text-xs rounded-lg px-3 py-2 text-white focus:outline-none focus:border-cyan-400 uppercase">
                    <option value="">TODOS LOS ESTADOS</option>
                </select>
                <select id="filterResponsable" onchange="filtrarDatos()" class="bg-slate-900 border border-slate-700 text-xs rounded-lg px-3 py-2 text-white focus:outline-none focus:border-cyan-400 uppercase">
                    <option value="">TODOS LOS RESPONSABLES</option>
                </select>
                <select id="filterEtapa" onchange="filtrarDatos()" class="bg-slate-900 border border-slate-700 text-xs rounded-lg px-3 py-2 text-white focus:outline-none focus:border-cyan-400 uppercase">
                    <option value="">TODAS LAS ETAPAS LEGALES</option>
                </select>
            </div>
            <div class="flex items-center space-x-2">
                <button onclick="exportarJSON()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs px-3.5 py-2 rounded-lg font-medium flex items-center gap-1.5 transition-all">
                    <i data-lucide="download" class="w-3.5 h-3.5"></i> Exportar Respaldo
                </button>
                <button onclick="importarJSONPrompt()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs px-3.5 py-2 rounded-lg font-medium flex items-center gap-1.5 transition-all">
                    <i data-lucide="upload" class="w-3.5 h-3.5"></i> Importar Datos
                </button>
            </div>
        </div>

        <!-- Data Table Container -->
        <div class="glass-panel rounded-xl overflow-hidden shadow-2xl border border-slate-800
