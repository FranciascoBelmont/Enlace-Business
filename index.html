<!DOCTYPE html>
<html lang="es" class="h-full bg-slate-950">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ENLACE Business PRO - Sistema Integral</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif; }
    .bg-grid { background-image: radial-gradient(rgba(59, 130, 246, 0.12) 1px, transparent 0); background-size: 24px 24px; }
  </style>
</head>
<body class="h-full text-slate-100 bg-slate-950 antialiased selection:bg-blue-500 selection:text-white">

  <!-- ==================== PANTALLA DE LOGIN ==================== -->
  <div id="loginOverlay" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950 bg-grid p-4">
    <div class="w-full max-w-md rounded-2xl border border-slate-800 bg-slate-900/90 p-8 shadow-2xl backdrop-blur-xl">
      <div class="mb-8 text-center">
        <div class="mx-auto mb-4 flex h-16 w-16 items-center justify-center rounded-2xl bg-blue-600/20 text-blue-500 ring-1 ring-blue-500/30">
          <i class="fa-solid fa-shield-halved text-3xl"></i>
        </div>
        <h1 class="text-2xl font-bold tracking-tight text-white">ENLACE Business PRO</h1>
        <p class="mt-1 text-sm text-slate-400">Sistema Integral de Recuperación Inmobiliaria & Legal</p>
      </div>

      <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-5">
        <div>
          <label for="username" class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Usuario</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-500">
              <i class="fa-solid fa-user text-sm"></i>
            </span>
            <input type="text" id="username" required autocomplete="username" class="w-full rounded-xl border border-slate-700/80 bg-slate-950/80 py-3 pl-10 pr-4 text-sm text-white placeholder-slate-500 transition focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500/20" placeholder="Ingrese su usuario">
          </div>
        </div>

        <div>
          <label for="password" class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Password</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-500">
              <i class="fa-solid fa-lock text-sm"></i>
            </span>
            <input type="password" id="password" required autocomplete="current-password" class="w-full rounded-xl border border-slate-700/80 bg-slate-950/80 py-3 pl-10 pr-4 text-sm text-white placeholder-slate-500 transition focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500/20" placeholder="••••••••">
          </div>
        </div>

        <div id="loginError" class="hidden rounded-xl bg-red-500/10 border border-red-500/30 p-3 text-center text-xs font-medium text-red-400">
          Usuario o contraseña incorrectos.
        </div>

        <div class="flex items-center space-x-3 pt-2">
          <button type="button" onclick="clearLoginForm()" class="w-1/2 rounded-xl border border-slate-700 bg-slate-800/80 py-3 text-sm font-semibold text-slate-300 transition hover:bg-slate-700 hover:text-white">Cancelar</button>
          <button type="submit" class="w-1/2 rounded-xl bg-blue-600 py-3 text-sm font-semibold text-white transition hover:bg-blue-500 shadow-lg shadow-blue-600/20">Ingresar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ==================== PANEL PRINCIPAL ==================== -->
  <div id="mainApp" class="hidden min-h-full flex-col">
    <!-- Encabezado / Navbar Superior -->
    <header class="sticky top-0 z-40 border-b border-slate-800 bg-slate-900/80 backdrop-blur-md">
      <div class="mx-auto flex max-w-7xl items-center justify-between px-4 py-4 sm:px-6 lg:px-8">
        <div class="flex items-center space-x-3">
          <div class="flex h-10 w-10 items-center justify-center rounded-xl bg-blue-600 text-white font-bold shadow-md shadow-blue-600/30">
            <i class="fa-solid fa-building text-lg"></i>
          </div>
          <div>
            <h1 class="text-lg font-bold tracking-tight text-white">ENLACE <span class="text-blue-500">BUSINESS PRO</span></h1>
            <p class="text-xs text-slate-400">Sistema Integral de Recuperación Inmobiliaria & Legal</p>
          </div>
        </div>

        <div class="flex items-center space-x-3">
          <div class="relative hidden md:block w-64">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-500">
              <i class="fa-solid fa-search text-xs"></i>
            </span>
            <input type="text" id="inputBuscador" oninput="aplicarFiltros()" placeholder="BUSCAR EN BASE DE DATOS..." class="w-full rounded-xl border border-slate-700/80 bg-slate-950/80 py-2 pl-9 pr-4 text-xs text-white placeholder-slate-500 focus:border-blue-500 focus:outline-none">
          </div>

          <button onclick="alert('Módulo de Verificación de Duplicados activo')" class="hidden sm:flex items-center rounded-xl border border-slate-700 bg-slate-800 px-3.5 py-2 text-xs font-semibold text-slate-300 transition hover:bg-slate-700 hover:text-white">
            <i class="fa-solid fa-clone text-blue-400 mr-1.5"></i>Verif. Duplicados
          </button>

          <button onclick="alert('Abriendo formulario de Nuevo Registro')" class="flex items-center rounded-xl bg-blue-600 px-3.5 py-2 text-xs font-semibold text-white transition hover:bg-blue-500 shadow-md shadow-blue-600/20">
